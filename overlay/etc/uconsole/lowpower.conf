# uConsole low-power policy.
#
# Read by uconsole-screen-toggle (user context) and uconsole-lowpower (root).
# Plain shell assignments -- this file is SOURCED, so no command substitution
# and no spaces around '='.
#
# There is no suspend on this hardware and there never will be: see
# docs/HARDWARE.md S3.9. What follows is the userspace substitute -- switch off
# what a blanked machine is not using, and put it all back on wake.

### What happens on a short power-button press ------------------------------

# Wi-Fi and Bluetooth off while blanked.
#
# This is safe here specifically because rfkill does NOT run brcmfmac's suspend
# callback -- that callback is what wedges the SDIO backplane, and it only fires
# on a real PM transition, which this image makes unreachable.
#
# If a blank ever leaves you stranded, the recovery does not need the network:
#   Ctrl+Alt+F2  ->  log in  ->  sudo uconsole-unstick --unlock
# Set this to 0 if you would rather keep SSH reachable while the screen is off.
RADIO_OFF_ON_BLANK=1

# LTE modem off while blanked.
#
# The single largest power saving available here, and also the slowest thing to
# come back: re-powering the module and re-registering on the network can take
# up to the 180s timeout on uconsole-modem-connect.service. The wake path never
# blocks on it -- the reconnect is backgrounded, so the desktop returns
# immediately and LTE catches up behind it -- but expect a gap of anywhere from
# twenty seconds to a couple of minutes before data flows again.
#
# That gap is the whole trade. Set this to 0 if you blank the screen in short
# bursts and would rather keep the bearer alive; leave it at 1 if the device
# spends its blanked time in a bag.
#
# Note the interaction with uconsole-wan: routing mode lives in /run and does
# not survive the modem being cycled, so a wake returns you to the boot default
# rather than to whatever `uconsole-wan lte|wifi|auto` you last selected.
MODEM_OFF_ON_BLANK=1

# Also drop the modem's supply rail, not just its radio. OFF by default.
#
# The first attempt at MODEM_OFF_ON_BLANK did exactly this -- released the
# GPIO holding POWER_MCU -- and it did not work: the SIM7600 stayed enumerated
# and nothing verified otherwise. Releasing that line is not a power-down
# sequence. MODEM_OFF_ON_BLANK now uses ModemManager's low-power state, which is
# reversible in seconds and can be read back.
#
# Cutting the rail as well costs a full USB re-enumeration on wake (up to the
# 180s unit timeout) and buys little once the radio is already asleep.
MODEM_RAIL_OFF_ON_BLANK=0

# Clamp the CPU to its minimum frequency and switch to the powersave governor.
#
# Expect little from this on its own. schedutil already sits at scaling_min_freq
# when idle, and on BCM2712 that floor is 1.5GHz -- so the clamp does not lower
# the idle point, it only stops background work from ramping to 2.4GHz.
CPU_CLAMP_ON_BLANK=1

# Take cores 1-3 offline while blanked, leaving cpu0.
#
# DEFAULT 0 BECAUSE BRING-UP WAS OBSERVED TO FAIL ON THIS BOARD.
#
# Measured 2026-09-08: after a blank/wake cycle the machine stayed at 1 of 4
# cores. The write to `online` returned success; the core simply did not come
# back, and nothing said so. The machine then ran degraded indefinitely -- a
# later measurement run recorded its own "screen on, idle" baseline at one core
# without anyone noticing.
#
# uconsole-lowpower now reads the value back and logs loudly when a core stays
# offline, so re-enabling this is safe to TEST. Do not leave it on until you
# have confirmed cores return:
#
#   sudo uconsole-lowpower down; sleep 5; sudo uconsole-lowpower up
#   uconsole-lowpower status        # must read "cores : 4 of 4 online"
#
# The saving was small in any case: measured draw is dominated by the SoC, the
# DSI panel and the RP1/USB tree, not by the CPU.
CPU_OFFLINE_CORES_ON_BLANK=0

# Mute the audio sink while blanked.
#
# The wake path unmutes unless the sink was ALREADY muted when the blank started,
# in which case it is left alone. It records our own action, not the prior state:
# saving the prior state latches, because once anything leaves the sink muted
# every later cycle faithfully re-mutes it and the machine goes silent for good.
# A missing state file means unmute.
#
# Worth more than it looks on this hardware: audio is PWM on GPIO 12/13 with no
# codec, and LTE transmit bursts arrive on it as audible static (S3.10). A
# blanked device in a bag with the modem live is exactly that situation.
MUTE_ON_BLANK=1

# How long the power key must be held for a clean poweroff, in milliseconds.
#
# logind's own long-press is a hardcoded 5s that no systemd version lets you
# change, and the AXP223's forced-off register offers only 4/6/8/10s -- and is
# deliberately parked at 10s so it always loses the race to a clean shutdown.
# This is measured by sway instead, and fires WHILE THE KEY IS STILL DOWN so the
# shutdown is felt at the moment it starts rather than when you let go.
#
# Firing on a timer is only safe because the timer does not trust the release
# event: when it expires it asks the kernel whether the key is still physically
# held (evtest --query). A tap therefore cannot power the machine off even if the
# release binding is missed entirely.
#
# Both of those remain underneath, untouched: hold past 5s without releasing and
# logind powers off; hold 10s through a kernel hang and the PMIC cuts power. This
# only adds a faster path when sway is running to see the key.
POWERKEY_HOLD_MS=2000

### Battery ------------------------------------------------------------------

# Pack energy in watt-hours, used ONLY to turn a measured draw into an estimated
# runtime in uconsole-power-probe. Nothing depends on it for safety -- the
# low-voltage guard is voltage-based and does not consult this.
#
# Default is 2x 18650 at 3.7V 2000mAh in PARALLEL: 3.7 * 4.0 = 14.8 Wh.
#
# Parallel, not series, and that is not a guess: the AXP223 is a single-cell
# PMIC, and the pack reads 3.4-4.2V in sysfs. Two cells in series would read
# double that. Two 2000mAh cells in parallel therefore behave as one 4000mAh
# cell at 3.7V nominal.
#
# Do not edit this by hand after a cell swap -- let the tool do the arithmetic:
#
#   sudo uconsole-power-probe pack 2x3500     # -> 25.9 Wh, written here
#   sudo uconsole-power-probe pack 2x2000     # -> 14.8 Wh
#   uconsole-power-probe pack                 # show what is set now
#
# The formula, if you want it: PACK_WH = 3.7 * (total mAh / 1000).
#
# SAFETY, if you are swapping cells: in a parallel pair the AXP223 sees one
# cell and balances nothing. Use two cells of the SAME capacity, same age and
# same charge level. A 3500mAh cell wired alongside a 2000mAh one will dump
# current into it on connection, and the pair will drift further apart with
# every cycle. Pair the 2000s together or the 3500s together, never one of each.
#
# Runtime figures derived from this are OPTIMISTIC. uconsole-battery-guard shuts
# down at 3.40V, well above where a 18650 is actually empty, so a few percent of
# the nominal energy is never available. Treat the estimate as an upper bound.
PACK_WH=14.8

### Session restore ----------------------------------------------------------

# Bring back the applications that were open before the last poweroff.
#
# This is the point of the whole exercise. Suspend does not work on this
# hardware and a blanked machine still draws ~3.2W of SoC, DSI panel and RP1
# that userspace cannot switch off -- so the only state that reaches zero is
# "off", and what makes "off" tolerable is coming back to where you were.
#
# uconsole-session-snapshot records continuously while sway runs;
# uconsole-session-restore replays it at the next login. What decides whether a
# login is a RESUME is the boot id stamped in the snapshot: a differing one
# means the machine went down and came back. Nothing is written at shutdown, so
# a crash, a battery pull and the low-voltage guard all restore identically.
SESSION_RESTORE=1

# Applications NOT to relaunch, space separated by app_id. Empty restores
# everything in the snapshot that still has a runnable command.
#
# A denylist, not an allowlist. An allowlist has to be edited every time you
# install something, and until you do, that application silently fails to come
# back with nothing said anywhere -- the wrong default for a machine you keep
# adding software to. Anything skipped by this list IS logged.
#
# Worth naming here: something whose command line is a one-shot you would not
# want re-run at login.
SESSION_RESTORE_SKIP=""

# Upper bound on how many applications a restore will launch, so a snapshot
# taken with twenty windows open does not produce a twenty-way launch storm on a
# machine with four cores and an SD card.
SESSION_RESTORE_MAX=10

### Escalation --------------------------------------------------------------

# Minutes a blanked, unplugged machine may sit before it saves session state and
# powers off. 0 disables escalation entirely.
#
# NOT YET IMPLEMENTED -- reserved for the standby timer. Present here so the key
# name is settled before anything depends on it.
STANDBY_POWEROFF_MIN=0

# What a long power-button press does:
#   suspend   save session state, power off, restore on next login
#   poweroff  clean power off, no restore
#
# NOT YET IMPLEMENTED -- reserved for uconsole-powermode.
LONGPRESS_ACTION=poweroff
