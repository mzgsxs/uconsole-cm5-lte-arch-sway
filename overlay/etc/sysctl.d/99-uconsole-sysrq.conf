# Enable the magic SysRq keys needed for REISUB.
#
#   4 unraw keyboard   64 signalling (E, I)   16 sync   32 remount-ro   128 reboot
#   4 + 64 + 16 + 32 + 128 = 244
#
# Deliberately not 1 (everything): this is the emergency-recovery subset and
# leaves out crash-dump and console-logging control, which are of no use here.
#
# IMPORTANT LIMITATION: the uConsole's keyboard is USB, behind the Maple MCU. If
# a hang has taken USB down with it, SysRq cannot be delivered and none of this
# helps. It is useful for the hangs where the kernel is alive and userspace is
# not: a wedged compositor, an OOM stall, a runaway process. For everything
# else, the watchdog is the answer (/etc/systemd/system.conf.d/uconsole-watchdog.conf).
#
# There is no privilege escalation here. No SysRq gives a shell, and anyone able
# to press these keys can already hold the power button.
kernel.sysrq = 244
