[Login]
# Short press -> handled by the compositor (blanks the backlight).
# Long press (~5s) -> clean poweroff.
#
# Suspend is deliberately NOT used. An earlier version of this comment claimed
# the kernel had none of these states at all; that was true of CM4 and is false
# here -- /sys/power/state reads "freeze mem" on this build. Both are unusable:
# "deep" is a PSCI firmware stub (BCM2712 has no DDR self-refresh sequences) and
# "s2idle" wedges the SDIO Wi-Fi chip hard enough to need a reboot. The sleep
# targets are masked in this image. See docs/HARDWARE.md S3.9.
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
