# Hardware watchdog: the only way to recover a wedged CM5 without opening the case.
#
# THE PROBLEM THIS SOLVES
#
# On CM4 a long power-button hold triggers a hardware cutoff. On CM5 it does
# not. Raspberry Pi changed the power-control pins between the two modules, and
# the consequence -- confirmed on the ClockworkPi forums and reproduced here --
# is that the power button only works WHILE THE KERNEL IS STILL RESPONDING. A
# hard hang therefore leaves exactly one documented option: take the back panel
# off and pull the 18650s. That has happened four times on this unit, and each
# unclean cut left the FAT boot partition dirty.
#
# bcm2835-wdt is built into this kernel. Arming it means systemd pets
# /dev/watchdog0 from its main loop, and a kernel that stops running resets
# itself after the timeout instead of sitting there until someone finds a
# screwdriver.
#
# 15s is effectively the hardware maximum: the BCM2835-derived watchdog counts a
# 20-bit register at 65536 Hz, so it tops out just under 16 seconds. systemd
# pings at half the interval. If the driver accepts less, systemd uses what it
# got and says so at boot.
#
# TWO THINGS THIS DOES NOT DO
#
# It is still an UNCLEAN reset -- the same filesystem risk as pulling the
# battery. It saves the disassembly, not the fsck. And it may not fire during a
# suspend hang specifically, because the watchdog driver's own suspend callback
# can stop the timer; it should still catch a hang during the unwind, which is
# where this hardware actually dies.
#
# To disable: comment out RuntimeWatchdogSec and `systemctl daemon-reexec`.
[Manager]
RuntimeWatchdogSec=15
# Guards the shutdown path itself, so a reboot that hangs also recovers.
RebootWatchdogSec=2min
