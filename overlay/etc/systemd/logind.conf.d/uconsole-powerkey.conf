[Login]
# Short press -> handled by the compositor (blanks the backlight).
# Long press (~5s) -> clean poweroff.
#
# Suspend is deliberately NOT used: this kernel registers no sleep states at
# all (/sys/power/state is empty), so HandlePowerKey=suspend would silently do
# nothing. See report S3.8 for why DSI power-down is also risky here.
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
