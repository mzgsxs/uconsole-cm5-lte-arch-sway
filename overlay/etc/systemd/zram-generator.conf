# Compressed swap in RAM. The machine has 4 GB and no swap device, and the
# kernel command line carries cgroup_disable=memory, so an out-of-memory
# condition hard-locks rather than degrading. zstd gives roughly 3:1 on typical
# desktop pages, so 2 GB of zram behaves like ~6 GB of relief for the cost of
# some CPU.
[zram0]
zram-size = min(ram / 2, 2048)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
