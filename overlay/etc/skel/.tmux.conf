# tmux configuration for the uConsole.
#
# TPM and the plugins are pre-installed under ~/.tmux/plugins by the image, so
# there is no need to run `prefix + I` on a fresh account -- they load on the
# first tmux start.

### General
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",foot*:Tc"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g status-position top

### Colours: black background, green text, matching the desktop
set -g status-style 'bg=#000000 fg=#00ff00'
set -g status-left '#[bold]#S '
set -g status-right '%a %d %b %H:%M '
setw -g window-status-current-style 'bg=#002200 fg=#00ff00 bold'
setw -g window-status-style 'fg=#007700'
set -g pane-border-style 'fg=#003300'
set -g pane-active-border-style 'fg=#00ff00'
set -g message-style 'bg=#000000 fg=#00ff00'

### Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save every 15 minutes, and restore automatically whenever the tmux server
# starts -- that hook is what brings sessions back after a reboot.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Bring back pane contents and running programs, not just the layout.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# NOTE: @continuum-boot is deliberately NOT set. It would have continuum write
# its own systemd user unit; the image ships tmux.service instead, so that the
# server is started the same way on every account without tmux having to have
# run once first.

run '~/.tmux/plugins/tpm/tpm'
